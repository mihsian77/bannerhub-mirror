name: mirror

on:
  schedule:
    - cron: "0 19 * * *"   # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      bucket:
        description: "只同步某一类（留空=全部）"
        required: false
        default: ""
      max_gb:
        description: "单个分类的体积上限（GB）"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: mirror-${{ github.event.inputs.bucket || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set.outputs.buckets }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg = json.load(open("upstream.json"))
          b = sorted(set(cfg["typeToBucket"].values()))
          want = "${{ github.event.inputs.bucket }}"
          if want:
              b = [x for x in b if x == want]
          print("buckets=" + json.dumps(b))
          PY

  sync:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        bucket: ${{ fromJSON(needs.plan.outputs.buckets) }}
    steps:
      - uses: actions/checkout@v4

      - name: 同步 ${{ matrix.bucket }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: ${{ github.repository }}
        run: |
          python3 tools/mirror.py --sync \
            --bucket "${{ matrix.bucket }}" \
            --max-gb "${{ github.event.inputs.max_gb || '12' }}" \
            --max-files 3000

      - name: 记录进度
        run: |
          git config user.name "bannerhub-mirror"
          git config user.email "noreply@github.com"
          git add state
          if git diff --cached --quiet; then
            echo "无变更"; exit 0
          fi
          git commit -m "state: ${{ matrix.bucket }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "state 推送失败，下轮会重新比对"; exit 0
