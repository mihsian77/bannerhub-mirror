name: mirror

on:
  schedule:
    - cron: "0 19 * * *"   # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      bucket:
        description: "只同步某一类（留空=全部）"
        required: false
        default: ""
      max_gb:
        description: "单个分类的体积上限（GB）"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: mirror-${{ github.event.inputs.bucket || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set.outputs.buckets }}
    steps:
      - uses: actions/checkout@v4

      - name: 生成清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: ${{ github.repository }}
        run: python3 tools/mirror.py --manifest

      - name: 提交清单
        run: |
          git config user.name "bannerhub-mirror"
          git config user.email "noreply@github.com"
          git add manifests
          if git diff --cached --quiet; then echo "清单无变化"; exit 0; fi
          git commit -m "manifest: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "清单推送失败，不影响同步"

      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          cfg = json.load(open("upstream.json"))
          b = set()
          for src in cfg["sources"]:
              b |= set((src.get("catalogBuckets") or {}).values())
              for v in (src.get("splitBuckets") or {}).values():
                  b |= set(v)
          b |= {"wine", "system", "runtimes-bin", "unindexed"}
          b = sorted(b)
          want = "${{ github.event.inputs.bucket }}"
          if want:
              b = [x for x in b if x == want]
          print("buckets=" + json.dumps(b))
          PY

  sync:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        bucket: ${{ fromJSON(needs.plan.outputs.buckets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 同步 ${{ matrix.bucket }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: ${{ github.repository }}
        run: |
          python3 tools/mirror.py --sync \
            --bucket "${{ matrix.bucket }}" \
            --max-gb "${{ github.event.inputs.max_gb || '5' }}" \
            --max-files 400

      - name: 记录进度
        run: |
          git config user.name "bannerhub-mirror"
          git config user.email "noreply@github.com"
          git add state
          if git diff --cached --quiet; then
            echo "无变更"; exit 0
          fi
          git commit -m "state: ${{ matrix.bucket }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "state 推送失败，下轮会重新比对"; exit 0
